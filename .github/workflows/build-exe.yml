name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name "发货录制终端" shiprecorder.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: 发货录制终端 v1.2
          body: |
            发货录制终端 v1.2（MFEC 录制终端免费平替）
            下载下面的 exe，双击就能用，不用装 Python。
            摄像头、扫码枪、保存文件夹等在软件右上角“设置”里调。
            v1.2 修复：默认开 MJPG 模式，摄像头走压缩格式、省 USB 带宽，
            解决 1080p 下处理帧数只有几帧/秒的问题（很多 4K 摄像头默认
            不压缩的 YUY2，1080p 就占满 USB 2.0 带宽）；摄像头请插电脑上
            蓝色的 USB 3.0 口，不要接分线器。
            v1.1 修复：设置（摄像头/终端号/保存文件夹）现在能记住了，
            重开软件不用再选摄像头；自动裁掉某些摄像头驱动造成的画面黑边；
            语音播报提前合成好缓存，扫码时秒播报，不用等联网合成。
          files: dist/*.exe
