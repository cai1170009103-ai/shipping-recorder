name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name "凯博助手" --icon kaibo.ico --add-data "kaibo.ico;." shiprecorder.py

      # pyinstaller --name 用中文名时产出的 exe 文件名仍可能是 default.exe，
      # 这里强制改名，确保发布出去的资产真叫“凯博助手.exe”。
      - name: Rename exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if ($exe -and $exe.Name -ne '凯博助手.exe') {
            Rename-Item $exe.FullName -NewName '凯博助手.exe'
          }
          Get-ChildItem dist/*.exe | ForEach-Object { $_.Name }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: 凯博助手 v1.3
          body: |
            凯博助手 v1.3（MFEC 录制终端免费平替）
            改名凯博助手，换了战甲风新图标（透明底）。
            下载下面的 exe，双击就能用，不用装 Python。
            摄像头、扫码枪、保存文件夹等在软件右上角“设置”里调。
            v1.3 新功能：
            磁盘满自动保护：录制中剩余空间不足先删最旧视频腾空间，还不够就自动停录保存；空间不够时拒绝开始录制（设置 → 保存 → 磁盘保护，默认 500MB）。
            视频文件更小：默认 H.264 编码，文件约小一半，打不开自动回落 mp4v（设置 → 录制 → 视频编码）。
            帧数压榨：水印只贴标签区域、预录制 JPG 质量降到 70，1080p 处理帧数更高。
            摄像头断线自动重连：断线后自动重开摄像头；录制中断线超过 30 秒自动停录保存（设置 → 录制 → 断线重连）。
            扫码记录导出 Excel：扫码记录窗口点“导出 Excel”（没装 openpyxl 可存 CSV）。
            当前单号大字显示：画面上方大字显示当前单号和已录时长。
            录制状态更醒目：录制时顶栏变红、画面区红框。
            打开保存文件夹：顶栏一点就打开视频文件夹。
            主界面今日已录：画面右侧直接看今天录的单，双击打开视频。
            v1.2 修复：默认开 MJPG 模式，摄像头走压缩格式、省 USB 带宽，
            解决 1080p 下处理帧数只有几帧/秒的问题（很多 4K 摄像头默认
            不压缩的 YUY2，1080p 就占满 USB 2.0 带宽）；摄像头请插电脑上
            蓝色的 USB 3.0 口，不要接分线器。
            放大倍数可调：设置 → 扫码后放大 → 倍数（默认 2 倍，可选 1.5/2/2.5/3/4 倍），
            红框跟着倍数变，框里是什么、放大就是什么。
            全屏按钮：点顶栏“全屏”（或双击画面）铺满整个屏幕，Esc 退出；
            修了最大化/全屏时底部状态栏被顶出屏幕的问题。
            v1.1 修复：设置（摄像头/终端号/保存文件夹）现在能记住了，
            重开软件不用再选摄像头；自动裁掉某些摄像头驱动造成的画面黑边；
            语音播报提前合成好缓存，扫码时秒播报，不用等联网合成。
          files: dist/*.exe
